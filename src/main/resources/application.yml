spring:
  application:
    name: issues-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:issues_db}
    username: ${DB_USER:dormsupport}
    password: ${DB_PASSWORD:dormsupport}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

events:
  issue-topic: ${ISSUE_EVENTS_TOPIC:dormsupport.issue-events}

services:
  auth-uri: ${AUTH_SERVICE_URI:http://auth-service:8080}

auth:
  jwt:
    secret: ${JWT_SECRET:lI0NyCpHUBwt9I/uZwMWw4FBM3QJRWHJ8SaxTCJsqFic=}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
