spring:
  application:
    name: issues-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:issues_db}
    username: ${DB_USER:dormsupport}
    password: ${DB_PASSWORD:dormsupport}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
